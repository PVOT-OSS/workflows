name: REUSE

on:
  workflow_call:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: REUSE compliance check
        uses: fsfe/reuse-action@v5
